[project]
name = "ragdemo-api"
version = "0.1.0"
# 與根 pyproject.toml／.python-version／backend/Dockerfile（python3.12）對齊：
# 原為 >=3.11，但實際產線跑 3.12，放寬下限只會讓某台機器裝 3.11 通過、行為卻與容器不一致。
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.0",
  "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
