name: ragdemo
services:
  qdrant:
    image: qdrant/qdrant:latest
    # 綁 tailscale 內網 IP：mbp/msi 備援 snapshot 由該 IP 拉取；阻斷 LAN(192.168)/公網。
    ports: ["${TS_IP}:6333:6333"]
    environment:
      # qdrant 原生 API key（防未授權讀寫向量庫）；值由 .env 帶入
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    # 綁 tailscale 內網 IP：mbp/msi 經 tailscale 連共享 registry（backends 心跳），
    # compose 內部連 postgres:5432 不受影響；阻斷 LAN(192.168)/公網。
    ports: ["${TS_IP}:5432:5432"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填（勿用 changeme）}
      POSTGRES_DB: ragdemo
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped
  api:
    build: ./backend
    # 僅本機（frontend dev / cloudflared 都走 localhost）。
    ports: ["127.0.0.1:8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # registry 共享：mbp/msi 以 root .env 的 POSTGRES_DSN 覆寫指向 x570 tailscale；x570 本機用預設 postgres
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://rag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}@postgres:5432/ragdemo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://100.119.83.111:11434}
      OLLAMA_URLS: ${OLLAMA_URLS:-http://100.119.83.111:11434}
      HOST_ID: ${HOST_ID:-x570}
      TS_IP: ${TS_IP:-100.119.83.111}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      KEEP_ALIVE: ${KEEP_ALIVE:--1}
      EMBED_MODEL: bge-m3:latest
      RERANK_MODEL: qllama/bge-reranker-v2-m3:latest
      COLLECTION: ${COLLECTION:-laws}
      OPENROUTER_GATEWAY_URL: ${OPENROUTER_GATEWAY_URL:-}
      CF_AIG_TOKEN: ${CF_AIG_TOKEN:-}
      CF_AIG_TOKEN_FILE: ${CF_AIG_TOKEN_FILE:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-cohere/north-mini-code:free,dots-studio/dots-3-note-preview:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,inclusionai/ling-3.0-flash-fin:free,inclusionai/ling-3.0-flash-sante:free,liquid/lfm-2.5-2.6b:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3.5-content-safety:free,nvidia/nemotron-3.5-lightning:free,poolside/laguna-s-2.1:free,poolside/laguna-xs-2.1:free,qwen/qwen3.8-27b:free,thinkingmachines/inkling-small:free,thinkingmachines/inkling:free,z-ai/glm-5.2:free}
      ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/zen/v1}
      ZEN_API_KEY: ${ZEN_API_KEY:-}
      ZEN_FREE_MODELS: ${ZEN_FREE_MODELS:-deepseek-v4-flash-free,muse-spark-1.3-contributor-free,mimo-v2.6-flash-free,mimo-v2.5-free,ling-3.0-flash-fin-free,nemotron-3-ultra-free,nemotron-3.5-lightning-free,space-bunny-free}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODELS: ${NVIDIA_MODELS:-nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3-flash,deepseek-ai/deepseek-v4.1-flash,mistralai/mistral-nemotron}
      GEMINI_GATEWAY_URL: ${GEMINI_GATEWAY_URL:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash,gemini-3.5-flash,gemini-flash-latest,gemini-flash-lite-latest}
      GROQ_GATEWAY_URL: ${GROQ_GATEWAY_URL:-}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
      COHERE_GATEWAY_URL: ${COHERE_GATEWAY_URL:-}
      COHERE_MODELS: ${COHERE_MODELS:-command-a-plus-05-2026,command-a-03-2025,command-r-plus-08-2024}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODELS: ${HF_MODELS:-deepseek-ai/DeepSeek-V4.1-Flash,Qwen/Qwen3.8-27B,zai-org/GLM-5.3-Flash,meta-llama/Llama-3.3-70B-Instruct}
      MISTRAL_GATEWAY_URL: ${MISTRAL_GATEWAY_URL:-}
      MISTRAL_MODELS: ${MISTRAL_MODELS:-ministral-8b-latest,codestral-latest}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_VERIFY_MIN: ${JEV_VERIFY_MIN:-0.4}
      JEV_BANK_MIN: ${JEV_BANK_MIN:-0.6}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on: [qdrant, postgres]
    volumes:
      - ./evals:/app/evals:ro
      - ./data/laws:/app/data/laws:ro
      - ./data/rules:/app/data/rules
      - /etc/machine-id:/run/secrets/host-machine-id:ro
      - /etc/hostname:/run/secrets/host-hostname:ro
    restart: unless-stopped
volumes:
  qdrant_data:
  pg_data:
