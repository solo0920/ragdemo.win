name: ragdemo
services:
  qdrant:
    # tag 釘死，不用 latest/latest-unprivileged：公開 repo ＋ 三機自動 pull，
    # 上游 latest 若被投毒會三台一起中招且無人 review。2026-09-26 由 latest 釘到 v1.19.1。
    # 升級方式：改這行 → docker compose pull && docker compose up -d → 驗 laws 筆數。
    image: qdrant/qdrant:v1.19.1
    # 預設綁 127.0.0.1：單機部署不需要 Tailscale 也能跑（這是「只要本機有 Docker」的
    # 前提之一）。要讓別台機器拉你的 snapshot，就設 TS_IP=<你的 tailscale IP>。
    # ⚠️ 舊版寫死 ${TS_IP:-100.119.83.111}，那是一台沒設定的機器會去搶 x570 身分的
    #    預設值（env-audit.py 早就在報這一條）。
    ports: ["${TS_IP:-127.0.0.1}:6333:6333"]
    environment:
      # qdrant 原生 API key（防未授權讀寫向量庫）；值由 .env 帶入
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped
  postgres:
    # 同上：不釘死等於放浮動。pg16 tag 目前解析到 0.8.6，故釘 0.8.6-pg16。
    # ⚠ pgvector 已有 pg18 變體，但 pg16→pg18 是跨大版本（需 dump/restore），不在本專案節奏內。
    image: pgvector/pgvector:0.8.6-pg16
    # 同上：預設綁 127.0.0.1。要讓 mbp/wsl 經 tailscale 共用你的 registry 才設 TS_IP。
    ports: ["${TS_IP:-127.0.0.1}:5432:5432"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填（勿用 changeme）}
      POSTGRES_DB: ragdemo
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped
  api:
    build: ./backend
    # 僅本機（frontend dev / cloudflared 都走 localhost）。
    ports: ["127.0.0.1:8000:8000"]
    # 讓容器內的程式碼能用 host.docker.internal 連到宿主機的 ollama。
    # Docker Desktop 本身就提供這個名稱，這行是給 **原生 Linux Docker** 補上
    # host-gateway 對應（沒有這行，Linux 上會 DNS 解析失敗）。
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # registry 共享：預設指向本機 postgres；要讓別台機器的 backends 心跳進你的
      # registry，才在 .env 改成 ${POSTGRES_PASSWORD}@<你的 TS_IP>:5432。
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://rag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}@postgres:5432/ragdemo}
      # 建立 pg 連線的逾時（秒）。不傳的話 asyncpg 用預設 60s，而症狀不是
      # 「等 60 秒後報錯」而是更難查的東西：2026-09-30 mbp 實測 DSN 指向離線
      # 位址時 /query +60s、/hosts 與 /models 掛死（Tailscale 上對端不回 RST，
      # TCP connect 一路掛到逾時，不像 localhost 的 refused 那樣立刻失敗）。
      # 程式端預設值已是 3（backend/app/common/pg.py），這裡只是讓 .env 能調。
      PG_CONNECT_TIMEOUT: ${PG_CONNECT_TIMEOUT:-3}
      # 預設指向**本機** ollama。舊預設是 x570 的 tailscale IP，一台沒設定的機器
      # 會去戳別台機器的 ollama，然後得到「連不上」而不是用自己的。
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_URLS: ${OLLAMA_URLS:-http://host.docker.internal:11434}
      # 原本讀得到但容器拿不到，2026-09-27 補上。這是 MSI「永遠降級成自己的 8b」
      # 的根因：沒傳進容器時 rag.py:41 fallback 成 [LLM_MODEL]（MSI=qwen3:8b），
      # 而 _llm_model_for() 對三個 URL 都回同一個 → x570/mbp 沒有 8b 被跳過。
      # ⚠️ 與 OLLAMA_URLS **位置對應**（rag.py:215 用 index 取值），長度不一致會
      #    讓某台 ollama 拿到別台的模型。改其一必改其二。
      # 預設值是巢狀的：rag.py:41 的 os.getenv 第二個參數就是 LLM_MODEL 這個
      # 「變數本身」而不是字面值，所以照抄成 ${LLM_MODEL:-qwen3:14b}。
      # 寫死成 qwen3:14b 會是靜默劣化 —— MSI 自己的 ollama（只有 8b）會被要求 14b。
      OLLAMA_MODELS: ${OLLAMA_MODELS:-${LLM_MODEL:-qwen3:14b}}
      # 必填，不再有預設值。舊預設是 x570 —— 那不只是鎖死：一台沒設 HOST_ID 的
      # 機器會冒用 x570 的身分覆寫它的 registry 條目，而且 /query 會自稱 x570
      # （registry.py 的預設卻是空字串，兩者互相矛盾）。改成 :? 是**更硬**的
      # 保護：忘了填就在 `docker compose up` 立刻失敗，而不是靜默頂用別人的名字。
      HOST_ID: ${HOST_ID:?HOST_ID 必填（這台機器的代號，例如 wsl）}
      # 主機身份。刻意「不」用 /etc/hostname、/etc/machine-id 的單檔 bind mount：
      # Docker Desktop（WSL）掛單一檔案不可靠，實測容器 init 直接 exit=127
      # （error mounting ... not a directory），而目錄型掛載正常 —— 只有這兩個會死。
      # 值由各機 .env 提供（per-machine，repo 不放）。registry.py 仍保留檔案 fallback，
      # 所以沒補 .env 的機器會退化並在 log 出警告，不會靜默用 MAC 冒充。
      HOST_NAME: ${HOST_NAME:-}
      HOST_MACHINE_ID: ${HOST_MACHINE_ID:-}
      # ↓ 以下 5 個原本讀得到但容器拿不到，2026-09-27 補上。預設值逐字抄
      #   backend/app/registry.py 與 rag.py 的 os.getenv 第二個參數。
      # registry 心跳間隔（秒）與 stale 判定（分鐘）—— /hosts 的「離線」判定
      # 依這兩個值（registry.py:22-23）。
      REGISTRY_HEARTBEAT: ${REGISTRY_HEARTBEAT:-30}
      REGISTRY_STALE_MIN: ${REGISTRY_STALE_MIN:-3}
      # 前端「連線與來源」彈窗的主機探測網址（rag.py HOST_API_URLS）。
      # 單一變數取代舊的 HOST_API_X570/MBP/MSI 三個 —— 舊版把三台寫死在變數名裡，
      # compose 沒有依 HOST_ID 動態選前綴的能力，所以第 4 台必須改 compose 重新 build。
      # 格式 'id=url,id=url'；**未設＝單機、沒有 peer**（本機仍會出現在 log 裡）。
      HOST_API_URLS: ${HOST_API_URLS:-}
      # 自己的 tailscale IP（registry 記錄用）。未設＝本機沒裝 Tailscale，不是錯誤。
      TS_IP: ${TS_IP:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      KEEP_ALIVE: ${KEEP_ALIVE:--1}
      # 降級後重測高位主機的間隔（秒）—— 原本讀得到但容器拿不到，2026-09-27 補上
      # （rag.py:155）。與 KEEP_ALIVE 同屬 rag.py:154-157 的時間參數叢集。
      PICK_TTL: ${PICK_TTL:-30}
      EMBED_MODEL: bge-m3:latest
      RERANK_MODEL: qllama/bge-reranker-v2-m3:latest
      COLLECTION: ${COLLECTION:-laws}
      # 相關性／信心閘門（rag.py:162-164）—— 原本讀得到但容器拿不到，
      # 2026-09-27 補上。校準自本機量測（正題 0.64–0.76、無關 0.43–0.57）。
      RAG_MIN_DENSE: ${RAG_MIN_DENSE:-0.58}
      RAG_MID_DENSE: ${RAG_MID_DENSE:-0.62}
      RAG_HIGH_DENSE: ${RAG_HIGH_DENSE:-0.70}
      # 探測遠端（/status、/health）與 LLM 的逾時秒數 —— 原本讀得到但容器拿不到，
      # 2026-09-27 補上（rag.py:172）。
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-2.5}
      OPENROUTER_GATEWAY_URL: ${OPENROUTER_GATEWAY_URL:-}
      CF_AIG_TOKEN: ${CF_AIG_TOKEN:-}
      # CF AI Gateway 的 gateway id —— 原本讀得到但容器拿不到，2026-09-27 補上
      # （rag.py:87，預設值 cloudflaregateway 逐字照抄）。
      CF_AIG_GATEWAY_ID: ${CF_AIG_GATEWAY_ID:-cloudflaregateway}
      CF_AIG_TOKEN_FILE: ${CF_AIG_TOKEN_FILE:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-cohere/north-mini-code:free,dots-studio/dots-3-note-preview:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,inclusionai/ling-3.0-flash-fin:free,inclusionai/ling-3.0-flash-sante:free,liquid/lfm-2.5-2.6b:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3.5-content-safety:free,nvidia/nemotron-3.5-lightning:free,poolside/laguna-s-2.1:free,poolside/laguna-xs-2.1:free,qwen/qwen3.8-27b:free,thinkingmachines/inkling-small:free,thinkingmachines/inkling:free,z-ai/glm-5.2:free}
      ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/zen/v1}
      ZEN_API_KEY: ${ZEN_API_KEY:-}
      ZEN_FREE_MODELS: ${ZEN_FREE_MODELS:-deepseek-v4-flash-free,muse-spark-1.3-contributor-free,mimo-v2.6-flash-free,mimo-v2.5-free,ling-3.0-flash-fin-free,nemotron-3-ultra-free,nemotron-3.5-lightning-free,space-bunny-free}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODELS: ${NVIDIA_MODELS:-nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3-flash,deepseek-ai/deepseek-v4.1-flash,mistralai/mistral-nemotron}
      GEMINI_GATEWAY_URL: ${GEMINI_GATEWAY_URL:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash,gemini-3.5-flash,gemini-flash-latest,gemini-flash-lite-latest}
      GROQ_GATEWAY_URL: ${GROQ_GATEWAY_URL:-}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
      COHERE_GATEWAY_URL: ${COHERE_GATEWAY_URL:-}
      COHERE_MODELS: ${COHERE_MODELS:-command-a-plus-05-2026,command-a-03-2025,command-r-plus-08-2024}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODELS: ${HF_MODELS:-deepseek-ai/DeepSeek-V4.1-Flash,Qwen/Qwen3.8-27B,zai-org/GLM-5.3-Flash,meta-llama/Llama-3.3-70B-Instruct}
      MISTRAL_GATEWAY_URL: ${MISTRAL_GATEWAY_URL:-}
      MISTRAL_MODELS: ${MISTRAL_MODELS:-ministral-8b-latest,codestral-latest}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # JEV（TypeSafe System One 決策模型）的端點 —— 原本讀得到但容器拿不到，
      # 2026-09-27 補上（rag.py:141）。刻意與 TYPESAFE_API_KEY 相鄰：兩者是同一個
      # 上游的「憑證／位址」配對，缺一個時 fail-open 回規則邏輯（不擋 query）。
      TYPESAFE_URL: ${TYPESAFE_URL:-https://api.typesafe.ai/v1/systemone}
      # ↓ 以下 2 個原本讀得到但容器拿不到，2026-09-27 補上（rag.py:142-143），
      #   放在 JEV_*_MIN 旁邊：同一個 JEV 開關叢集。
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      # 空字串＝不關閉（rag.py:143 認 "1"/"true"/"True"/"yes"）。預設值刻意留空
      # 而不是 0：必須逐字等於 os.getenv 的第二個參數 ""。
      # ⚠️ 註解裡不要寫出「$ + {…}」的插值語法：env-audit.py 與
      #    tests/test_env_audit.py 用 grep 掃整份 compose.yaml，會把註解裡的
      #    示範當成真的變數名（實測踩到：這行曾讓稽核誤報一個叫 VAR 的幽靈）。
      JEV_DISABLED: ${JEV_DISABLED:-}
      JEV_VERIFY_MIN: ${JEV_VERIFY_MIN:-0.4}
      JEV_BANK_MIN: ${JEV_BANK_MIN:-0.6}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on: [qdrant, postgres]
    volumes:
      - ./evals:/app/evals:ro
      - ./data/laws:/app/data/laws:ro
      - ./data/rules:/app/data/rules
      # law-update 的 request/status 檔案通道。為什麼需要它：容器跑不了 ingest 管線
      # （image 沒有 ingest/、data/laws 唯讀、沒裝 duckdb），管線是 host 端的 uv 工具鏈。
      # 所以容器只「記錄請求」，實際動作由 host 的 law-update-worker.sh 執行。
      - ./data/.ops:/app/ops
    restart: unless-stopped
volumes:
  qdrant_data:
  pg_data:
