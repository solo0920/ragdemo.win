# CI：把 .githooks/pre-push 的強制檢查搬到 GitHub Actions。
#
# 為什麼要有這份：pre-push 只在「按 push 的那台機器」上跑。三台機器各自一份
# .githooks/，任何一台沒設 core.hooksPath（或有人用 --no-verify），檢查就不發生。
# 公開 repo 讓 CI 成為可被外部驗證的證據，而不是各機自述。
#
# commit message 前綴（msi: / mbp: / x570:）不在這裡檢查 —— 那由 GitHub ruleset 的
# commit_message_pattern 在 server 端強制，見 ARCHITECTURE.md〈三機紀律〉。
#
# action 以 SHA 釘死（後面註解標版本），與 compose.yaml 釘 image tag 同一個理由：
# 公開 repo 加上游供應鏈被動過時，不該自動套用。Dependabot 會自動追 SHA 更新。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 唯讀權限：這份 workflow 不需要寫 repo（不發 comment、不開 PR）。
permissions:
  contents: read

# 同一 ref 的新 push 取消舊 run：省 runner，且結果以最新 commit 為準。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # 根 venv 供 tests/（pytest ＋ ragdemo-tools 依賴）；backend 依賴另外裝進同一個
      # venv，這樣測試若哪天開始 import fastapi / pydantic，不會突然缺套件而失敗。
      # 裝本專案只是為了帶進它的依賴 —— tests/ 是靠 tests/conftest.py 把 backend/
      # 塞進 sys.path 來 import app.*，不依賴「已安裝」這件事。
      # 兩種模式（editable / 非 editable）都會在 backend/ 留下 *.egg-info/（build
      # backend 就在 source tree 寫），已由 .gitignore 的 `*.egg-info/` 擋掉。
      - name: 安裝依賴
        run: |
          uv sync --frozen
          uv pip install ./backend

      - name: Python 語法檢查
        run: |
          fail=0
          for f in backend/app/*.py; do
            python3 -c 'import ast,sys; ast.parse(open(sys.argv[1],"rb").read())' "$f" \
              || { echo "::error::語法錯誤 $f"; fail=1; }
          done
          [ "$fail" -eq 0 ]

      # IP 準則：被 git 追蹤的檔案不得出現 LAN_IP= 賦值。.env 不進版控所以抓不到，
      # 但 .env.example / 文件 / 腳本若殘留即違規（見 ARCHITECTURE.md〈IP 準則〉）。
      - name: IP 準則（無 LAN_IP= 殘留）
        run: |
          if git grep -nE '^LAN_IP=' --; then
            echo "::error::追蹤檔案含 LAN_IP= 賦值，違反 IP 準則"
            exit 1
          fi
          echo "✓ 無 LAN_IP= 殘留"

      # 下面兩個工具**只為了讓 pytest 多跑 28 個測試**，不是測試本身需要。
      # 少了它們這 28 個測試是「靜默 skip」，而 CI 全綠 —— 守門等於不存在。
      #
      # · node → tests/test_frontend_hosts.py 的 10 個（它把 +server.ts 的函式抽出來
      #   用 node 真的跑一次）。**刻意不帶 cache: pnpm**：backend job 沒有
      #   pnpm/action-setup、也沒有 lockfile 要快取，帶了只會報錯。
      #   測試用 `node --experimental-strip-types` 跑 .ts，type stripping 在
      #   node 22.18+ 已是預設（flag 冗餘），但版本仍與 frontend job 同步釘 24。
      #   ⚠️ frontend/package.json 的 engines 宣告 >=22.12，低於 22.18 —— 那個
      #   缺口目前被「釘 24」蓋住，記在此處免得日後有人只 engines 就以為能跑。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # · sops + age-keygen → tests/test_rotate_secret.py 的 18 個，那是**唯一**
      #   會改寫三台共用憑證檔的腳本，長期零 CI 覆蓋。
      #
      #   sops 不在 Ubuntu 24.04 套件庫（packages.ubuntu.com/noble/sops 明確回
      #   "No such package"；Launchpad 只找得到同名的 orca-sops，是無關的 GNOME
      #   密碼管理器），所以只能下載。age 在套件庫有，但為了兩半用同一種驗證
      #   方式、也為了不比 sops 多一條 apt 供應鏈，同樣下載。
      #
      # ⚠️ 兩個 hash 的出處不同，別當成同等強度：
      #   sops — GitHub API digest **與上游 checksums.txt 宣告值一致**（雙重確認）
      #   age  — 僅 GitHub API digest。上游只發 minisign .proof、沒有
      #          checksums.txt，此處刻意不引入 minisign 換取對稱。
      #   兩者皆為 integrity（非 authenticity）：防傳輸損壞與資產被替換，
      #   防不住 release 帳號被入侵。
      #
      # ⚠️ age-keygen 來自 age 專案、與 sops 無關，**裝 sops 不會帶來它**。
      #   少了它那 18 個測試是 ERROR 不是 skip（subprocess FileNotFoundError），
      #   失敗訊息看起來像「測試寫壞了」而不是「少裝工具」，比 skip 更難診斷。
      #   刻意只裝 age-keygen、不裝整包 age：sops 用的是 age 的 Go library，
      #   只有測試自己 subprocess 呼叫 age-keygen，少一個多餘的攻擊面。
      - name: 安裝 sops + age-keygen（rotate-secret 測試需要）
        run: |
          set -euo pipefail
          T=$(mktemp -d); cd "$T"   # 離開 repo checkout：sops 52MB + age 19MB
          V_SOPS=3.13.3; V_AGE=1.3.2
          B=https://github.com/getsops/sops/releases/download/v${V_SOPS}
          A=https://github.com/FiloSottile/age/releases/download/v${V_AGE}
          curl -fsSL -o sops "${B}/sops-v${V_SOPS}.linux.amd64"
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          curl -fsSL -o age.tgz "${A}/age-v${V_AGE}-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tgz" | sha256sum -c -
          sudo install -m755 sops /usr/local/bin/sops
          tar xzf age.tgz
          sudo install -m755 age/age-keygen /usr/local/bin/age-keygen
          # 丟棄式金鑰：測試的 sandbox 會用這把 key 自己建 .sops.yaml，所以
          # 專案真正的 age 私鑰**永遠不需要進 CI**（repo 是公開的）。
          # 沒有這把 key 那 18 個測試還是會 skip —— 這行不是多餘的。
          age-keygen -o /tmp/agekey.txt && chmod 600 /tmp/agekey.txt
          echo "SOPS_AGE_KEY_FILE=/tmp/agekey.txt" >> "$GITHUB_ENV"

      # 直接呼叫 venv 內的 pytest，不用 `uv run`：uv run 會重新 sync，會把上面
      # uv pip install 裝進去的 backend 依賴視為 extraneous 而移除。
      # 預期結果是 351 passed / 3 skipped。那 3 個是**永久**的、與工具無關：
      #   tests/test_detect_host_endpoint.py:87/:118  需要 .env（gitignored）
      #   tests/test_embed_batch.py:69              需要 data/laws/laws_flat.jsonl
      #                                              （只有跑過 sync_daily 才存在）
      # 所以驗收條件是「依賴工具的 28 個 skip → 0」，**不是** 0 skipped。
      - name: pytest
        run: .venv/bin/pytest -q -p no:cacheprovider

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 下限寫在 frontend/package.json 的 engines（>=22.12）；這裡用 24（現行 LTS）。
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 驗證 compose.yaml 的 YAML 結構與變數插值。image tag 打錯、${VAR:?} 漏填，
      # 在三台機器上都要等到 pull / up 時才爆；這裡先擋。
      # 給的值都只是假值 —— 只驗證語法，不會真的啟動容器。
      #
      # ⚠️ HOST_ID 也要給（2026-09-30 補）。它是 compose.yaml 的必填項
      # `${HOST_ID:?…}`，2026-09-27 的 d02ba7e 把它改成必填之後，這裡沒跟著加
      # → **CI 從那天起每個 push 都紅**（run 9aafe9c 之後連續 10 次失敗）。
      # 教訓：改 compose 的必填變數清單時，記得更新這個 job 的 env 列表 ——
      # CI 是公開的「三機紀律」證據，它一直紅就等於沒有。
      - name: docker compose config
        env:
          TS_IP: 100.119.83.111
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          HOST_ID: msi
        run: docker compose config -q

  guards:
    name: 護欄（commit 前綴／單檔大小／憑證格式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要 before..after 範圍的完整歷史才能逐個檢查 commit
          fetch-depth: 0

      # 下面兩項原本打算用 GitHub ruleset 擋，但個人帳號的公開 repo 拿不到那些 rule：
      #   commit_message_pattern → 只適用「enterprise 擁有的 repo」（個人／一般 org 不行）
      #   max_file_size         → 只適用 push target，而 push ruleset 公開 repo 不可用
      # （實測：API 回 422 Invalid rule / "Source public repos cannot have push rules"）
      # 所以退到 CI：**能看見但不能阻擋** —— 檢查跑起來時 commit 已經在 main 上了。
      # 真正的第一道仍是各機的 .githooks/commit-msg（見 ARCHITECTURE.md〈三機紀律〉）。

      - name: "commit 訊息前綴須為 msi: / mbp: / x570:"
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER"          # 新分支，或 before 已不可得（force-push）
          else
            range="$BEFORE..$AFTER"
          fi
          bad=0
          for sha in $(git rev-list "$range"); do
            subj="$(git log -1 --format=%s "$sha")"
            if printf '%s' "$subj" | grep -Eq '^(msi|mbp|x570)[:：][[:space:]]' \
               || printf '%s' "$subj" | grep -Eq '^(Merge|Revert)'; then
              continue
            fi
            echo "::error title=缺少主機前綴::${sha:0:8}  ${subj}"
            bad=1
          done
          [ "$bad" -eq 0 ]

      - name: 單檔不得超過 10 MB
        run: |
          limit=$((10 * 1024 * 1024))
          bad=0
          while IFS= read -r f; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt "$limit" ]; then
              echo "::error title=單檔過大::${f}  $((sz / 1024 / 1024)) MB > 10 MB"
              bad=1
            fi
          done < <(git ls-files)
          [ "$bad" -eq 0 ]

      # 為什麼 push protection 還不夠（實測 security_and_analysis 現況）：
      #   secret_scanning_push_protection       = enabled   ← 只認 GitHub 合作廠商 pattern
      #   secret_scanning_non_provider_patterns = disabled  ← 自訂 pattern，個人帳號計畫開不了
      #   secret_scanning_validity_checks       = disabled
      # 也就是說「本專案自己會用到、但不在 GitHub 合作廠商清單裡」的格式完全沒有防線。
      # 掃「全部被追蹤的檔案」而不是 before..after 範圍：憑證一旦進來會留在樹裡好幾個
      # commit，後續任何一次 push 都該重新確認它還沒被清掉。
      #
      # 這些字面 pattern 不會匹配到本檔自己：`[` 不在 [A-Za-z0-9_-] 類別裡。
      # 長度門檻 20 是刻意的 —— 實測過 {8,} 也沒誤報，但 20 能擋掉像是變數名
      # （cfut_underscore）這類巧合命中。
      - name: 追蹤檔案不得含憑證
        run: |
          bad=0
          while IFS='|' read -r label pat; do
            [ -n "$label" ] || continue
            if git grep -nIE "$pat" --; then
              echo "::error title=疑似憑證外洩::命中 $label 格式，請立刻輪換該 key 並清除歷史"
              bad=1
            fi
          done <<'PATTERNS'
          Cloudflare（gateway AI token）|cfut_[A-Za-z0-9_-]{20,}
          NVIDIA（api key）|nvapi-[A-Za-z0-9_-]{20,}
          OpenRouter（api key）|sk-or-v1-[A-Za-z0-9_-]{20,}
          HuggingFace（token）|hf_[A-Za-z0-9]{30,}
          PATTERNS
          if [ "$bad" -eq 0 ]; then
            echo "✓ 無憑證格式殘留"
          fi
          [ "$bad" -eq 0 ]
