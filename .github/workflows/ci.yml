# 統一入口 —— 手動跑「全部驗證」用。
#
# 這份**不含任何 CI job 實作**，只有兩個 `uses:`。
#
# 為什麼是 dispatcher 而不是「把四個 job 複製一份留在這裡當後備」：複製的兩份會
# 漂移，而漂移正是這個 repo 已經吃過的虧 —— ci.yml.orig:282-288 記著
# `HOSTS=` 那條護欄因為「規則寫在兩處」而誤報 139 筆，最後靠人回滾。
# 同一個想法一份實作，就沒有第二份可以漂移。
#
# ⚠️ **`workflow_call` 不會讓被呼叫的 workflow 多跑一次。**
#    fast-ci.yml 與 full-ci.yml 各自也有自己的 push/pull_request/schedule 觸發；
#    從這裡呼叫時，事件沿用 caller 的，兩者共用同一個 concurrency group，
#    同一次事件只會有一個 run。手動觸發這裡 = Fast 跑一次 + Full 跑一次，
#    不會出現兩份。
#
# ── 手動觸發時，Full 的 commit 前綴稽核**不會執行** ──────────────────────────
#
# 這不是缺陷，是既有語意的必然結果，寫在這裡是為了別有人誤讀：
#
#   · 被呼叫的 reusable workflow 看到的是 **caller 的** `github.event_name`，
#     所以從這裡觸發時它是 `workflow_dispatch`，不是 `push`。
#   · full-ci.yml 的稽核 step 帶著 `if: github.event_name == 'push'`，
#     這個 gate 是**從原 ci.yml 原封不動搬過去的**（byte-identical）。
#   · 於是手動執行時該 step 被 skip —— **稽核沒有跑**。
#
# 為什麼不去掉那個 gate：稽核的範圍是 `github.event.before..github.sha`。
# 手動觸發沒有 before（push 事件才有），範圍會退化成整條分支的掃描；
# 整條分支在 force-push 情境下會把「規則還沒存在的年代」一起算進來。
# 那個邊界邏輯雖然處理得住（實測 368 commit、139 筆正確視為歷史、0 誤報），
# 但它是「關於整個歷史」的判斷，不該因為有人按了個按鈕就出現在一個
# 看似「跑完全部」的手動 run 裡。
#
# **結論：想真的跑稽核，就 push 或用 push 事件觸發 Full，不要用這裡。**
# 這裡是「快速重跑日常那幾道」與「事故時一次跑完 Fast + 深層驗證（不含歷史稽核）」。
name: ci

on:
  # ⚠️ **只有** workflow_dispatch。
  #
  # 刻意沒有 push / pull_request / schedule：這份若有任何自動觸發，
  # 就會和 fast-ci.yml、full-ci.yml 觸發同一批事件，造成 duplicate runs ——
  # 而「跑兩次」最危險的地方不是浪費 runner，是 cancel-in-progress 讓
  # 其中一份把另一份取消掉，結果看起來綠、實際少跑了一半。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast（全部 PR 門）
    uses: ./.github/workflows/fast-ci.yml

  full:
    name: full（merge／每日深層驗證）
    uses: ./.github/workflows/full-ci.yml