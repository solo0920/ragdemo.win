[project]
name = "ragdemo-tools"
version = "0.1.0"
description = "ragdemo 主機端工具（ingest / 分析 / eval）— 統一以 uv 管理環境"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]